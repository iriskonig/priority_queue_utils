[project]
name = "priority-queue-utils"
version = "0.1.1"
description = "A binary min-heap with stable handles and O(log n) decrease-key, so you can relax an edge or lower a cost without rebuilding the queue."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
